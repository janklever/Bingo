# Configuração de build e deploy do Netlify para o Bingo React+Vite

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer-when-downgrade"

# Redirecionamento SPA (Single Page Application) para roteamento de cliente
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
